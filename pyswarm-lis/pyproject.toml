[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyswarm-lis"
dynamic = ["version"]
description = 'Python simulator for point-mass drone swarm with local information sharing'
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "Alex033", email = "alexandre-1.hebert@outlook.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "alphashape~=1.3.1",
  "matplotlib>=3.8",
  "numpy~=1.26.4",
  "scipy~=1.11.4"
]

[project.urls]
Documentation = "https://github.com/Alex033/pyswarm-lis#readme"
Issues = "https://github.com/Alex033/pyswarm-lis/issues"
Source = "https://github.com/Alex033/pyswarm-lis"

[tool.hatch.version]
path = "src/pyswarm_lis/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/pyswarm_lis tests}"

[tool.coverage.run]
source_pkgs = ["pyswarm_lis", "tests"]
branch = true
parallel = true
omit = [
  "src/pyswarm_lis/__about__.py",
]

[tool.coverage.paths]
pyswarm_lis = ["src/pyswarm_lis", "*/pyswarm-lis/src/pyswarm_lis"]
tests = ["tests", "*/pyswarm-lis/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[project.scripts]
pyswarm_lis = "pyswarm_lis.GUI:main"

[tool.hatch.envs.docs]
dependencies = [
  "mkdocs>=1.0.0",
  "mkdocs-material>=7.0.0",
]

[tool.hatch.envs.docs.scripts]
build = "mkdocs build"
serve = "mkdocs serve --dev-addr localhost:8001"
